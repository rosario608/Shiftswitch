name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftswitch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shiftswitch_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shiftswitch_test
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: ShiftSwitch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npm run db:migrate

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

      # The deployable artefact, not just a Next build. Three of the four
      # things that broke this migration were invisible to `next build` and
      # only appeared here: a Node.js proxy the adapter refuses outright, an
      # optional `pg` dependency that file tracing never copied, and lint
      # walking the generated output. Without this step each of those would
      # have been found by a failed deploy instead of a failed check.
      - name: Cloudflare Worker build
        run: npm run build:worker

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftswitch_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shiftswitch_e2e
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: ShiftSwitch
      # The end-to-end suite signs in through the test-login endpoint, which is
      # refused outright when NODE_ENV=production.
      ALLOW_TEST_LOGIN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
