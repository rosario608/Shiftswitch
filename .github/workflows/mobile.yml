name: Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/**"
      - "tests/e2e-mobile/**"
      - "playwright.mobile.config.ts"
      - ".github/workflows/mobile.yml"
      # The native end-to-end job applies migrations and seeds a fixture, so a
      # change to either can break it even when nothing under mobile/ moved.
      - "scripts/**"
      - "db/**"
  pull_request:
    paths:
      - "mobile/**"
      - "src/**"
      - "tests/e2e-mobile/**"
      - "playwright.mobile.config.ts"
      - ".github/workflows/mobile.yml"
      # The native end-to-end job applies migrations and seeds a fixture, so a
      # change to either can break it even when nothing under mobile/ moved.
      - "scripts/**"
      - "db/**"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — typecheck, lint, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix mobile

      - name: Versions agree across both platforms
        run: node mobile/scripts/set-version.mjs --check

      - name: Typecheck
        run: npm --prefix mobile run typecheck

      - name: Lint
        run: npm run lint:mobile

      - name: Unit tests
        run: npm --prefix mobile run test

      - name: Build (development configuration)
        # This is the bundle the native end-to-end job drives. A development
        # build deliberately *does* contain the test-login path; that is what
        # makes the suite able to sign in without Google.
        run: npm --prefix mobile run build:dev

      - name: A production build compiles the development affordances out
        # Built against a dummy host purely to exercise the production path.
        # The real host and secrets belong to the release workflow — what is
        # being checked here is that the production *mode* strips test login
        # and source maps, which is a property of the code, not of the host.
        run: |
          set -euo pipefail
          cat > mobile/.env.production <<'ENV'
          VITE_API_URL=https://ci.invalid
          VITE_APP_SCHEME=shiftswitch
          VITE_ENVIRONMENT=production
          VITE_ALLOW_TEST_LOGIN=false
          VITE_APP_VERSION=0.0.0-ci
          ENV
          npm --prefix mobile run build
          rm -f mobile/.env.production

          if grep -rq "auth/test-login" mobile/dist/assets/*.js; then
            echo "::error::The test-login path survived a production build."
            exit 1
          fi
          if [ -n "$(ls mobile/dist/assets/*.map 2>/dev/null || true)" ]; then
            echo "::error::Source maps must not ship in a production bundle."
            exit 1
          fi
          # A development API base always carries a port (http://localhost:3000).
          # react-router embeds a bare, portless "http://localhost" as an
          # internal history fallback, which is harmless and must not fail this.
          if grep -rqE "https?://(localhost|127\.0\.0\.1|0\.0\.0\.0):[0-9]+" mobile/dist/assets/*.js; then
            echo "::error::A local API URL reached a production bundle."
            grep -rhoE "https?://(localhost|127\.0\.0\.1|0\.0\.0\.0):[0-9]+" mobile/dist/assets/*.js | sort -u
            exit 1
          fi
          if ! grep -rq "https://ci.invalid" mobile/dist/assets/*.js; then
            echo "::error::The configured API URL is not in the bundle — the build is not reading .env.production."
            exit 1
          fi
          echo "Production bundle is clean."

      - name: Rebuild the development bundle for the other jobs
        run: npm --prefix mobile run build:dev

  native-e2e:
    name: Native client — end-to-end
    runs-on: ubuntu-latest
    needs: client

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftswitch_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shiftswitch_e2e
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
      APP_URL: http://localhost:3100
      NEXT_PUBLIC_APP_NAME: ShiftSwitch
      ALLOW_TEST_LOGIN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix mobile

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:migrate

      - name: Drive the compiled app against a real server
        run: npx playwright test --config playwright.mobile.config.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: playwright-report/
          retention-days: 7

  android:
    name: Android — signed release bundle
    runs-on: ubuntu-latest
    needs: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix mobile

      - name: Build the client
        # A development configuration on branches: a store build needs the
        # production secrets, and those only exist in the release workflow.
        run: npm --prefix mobile run build:dev

      - name: Sync the native project
        working-directory: mobile
        run: npx cap sync android

      - name: Assemble a debug APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: The manifest requests only the permissions we declared
        working-directory: mobile/android
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -1)"
          # The Capacitor dynamic-receiver permission carries the application
          # id, which differs between build types, so it is filtered out.
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | grep "uses-permission" \
            | sed "s/.*name='\([^']*\)'.*/\1/" \
            | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" \
            | sort > /tmp/actual-permissions.txt
          cat /tmp/actual-permissions.txt

          printf '%s\n' \
            android.permission.ACCESS_NETWORK_STATE \
            android.permission.INTERNET \
            android.permission.POST_NOTIFICATIONS \
            android.permission.VIBRATE \
            android.permission.WAKE_LOCK \
            com.google.android.c2dm.permission.RECEIVE \
            | sort > /tmp/expected-permissions.txt

          if ! diff -u /tmp/expected-permissions.txt /tmp/actual-permissions.txt; then
            echo "::error::The permission set changed. Update GOOGLE_PLAY_DATA_SAFETY.md, APPLE_APP_PRIVACY_DECLARATION.md and this check together."
            exit 1
          fi

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
