name: Apply migrations to production

# Runs after CI passes on the default branch, and applies whatever the database
# is missing.
#
# ## Why this exists
#
# Every migration this project has ever applied went in by a person pasting SQL
# into a database console. That is how `docs/AI_PROJECT_STATE.md` came to be
# wrong about production twice — once claiming migrations were applied that were
# not, and once the reverse. A step that must happen after every deploy, always
# the same way, should not depend on somebody remembering it, and a record kept
# by hand of a thing done by hand is a record that drifts.
#
# ## Why `workflow_run` rather than `push`
#
# So that CI is a gate rather than a coincidence. On a plain `push` trigger this
# job starts the moment the commit lands and races the test suite: a migration
# whose own tests are about to fail would already be in production by the time
# anybody knew. `workflow_run` fires only when the CI workflow *finishes*, and
# the job below refuses unless it finished green.
#
# `workflow_run` also always uses the workflow file from the default branch, so
# a pull request cannot alter what this job does by editing it. That is a
# property worth having and not one to give up for a simpler trigger.
#
# ## Why it is safe to run unattended
#
# The runner is the one a developer runs: forward only, each file in its own
# transaction, already-applied files skipped, and a refusal if an applied file's
# bytes have changed. On top of that `scripts/apply-migrations-ci.ts` reads every
# pending file first and refuses the whole run if any of them would destroy
# data — a `DROP TABLE` is applied just as atomically as an `ADD COLUMN`, and
# the transaction around it is no comfort at all. A migration that means it says
# so in the file.
#
# It never resets, never drops, and never reads a row of programme data.
# Re-running it against an up-to-date database is a no-op that exits 0, which is
# what makes it safe to press again after a failed deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # For pressing by hand: a re-run after fixing a connection string, or the
  # first run on a database that was behind before this workflow existed.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm. Anything else stops before connecting.'
        required: true
        default: ''

# One at a time, and never cancelled halfway. Two pushes in quick succession
# must not have their migrations interleaved.
concurrency:
  group: production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply outstanding migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The gate. For an automatic run: CI must have finished green, on the
    # default branch. Anything else — a failed suite, a feature branch, a
    # cancelled run — and this job does not start at all.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch) }}

    steps:
      # Only for a hand-pressed run. An automatic one has already been through
      # review, a merge, and a green suite, which is a stronger confirmation
      # than a typed word.
      - name: Check the confirmation word
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'APPLY' }}
        run: |
          echo "::error::Type APPLY in the confirmation box to run this. Nothing was done."
          exit 1

      # `workflow_run` checks out the default branch, which is what should be
      # applied: the commit that just passed CI is on it.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Say which run triggered this
        run: |
          {
            echo "### Triggered by"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "A hand-pressed run by @${{ github.actor }}."
            else
              echo "CI run [#${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }}) on \`${{ github.event.workflow_run.head_branch }}\`, which finished **${{ github.event.workflow_run.conclusion }}**."
              echo ""
              echo "Commit \`${{ github.event.workflow_run.head_sha }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing configured yet is not a failure. A repository whose production
      # secret has never been set is a repository with no production to migrate,
      # and turning the default branch red for that is noise — the app already
      # says which migrations it is missing at /admin/diagnostics.
      #
      # A hand-pressed run fails instead, because somebody asked for it.
      - name: Stop if there is no connection string
        id: configured
        env:
          HAS_SECRET: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
        run: |
          if [ "$HAS_SECRET" != "true" ]; then
            {
              echo "### Nothing was applied"
              echo ""
              echo "No \`PRODUCTION_DATABASE_URL\` secret is set on this repository, so there is no database to migrate."
              echo "Set it under **Settings → Secrets and variables → Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No PRODUCTION_DATABASE_URL secret. Nothing was applied."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Reads the pending files, refuses anything destructive, applies the rest,
      # and writes what it did into the job summary. Every refusal it can
      # produce is written for whoever is reading a red pipeline rather than for
      # whoever wrote the migration.
      #
      # Nothing it prints contains the secret or any part of it.
      - name: Apply
        if: ${{ steps.configured.outputs.ready == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production
        run: npm run db:migrate:ci
