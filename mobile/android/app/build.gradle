apply plugin: 'com.android.application'

/**
 * Version numbers come from ../../version.json, the single source of truth
 * shared with iOS and with the release workflow, so a build can never disagree
 * with what was tagged. `versionCode` must increase on every Play upload;
 * `versionName` is what a resident sees.
 */
def versionJson = new groovy.json.JsonSlurper().parse(
    file("${rootDir}/../version.json")
)

/**
 * Release signing.
 *
 * The keystore and its passwords are read from android/key.properties, which
 * is git-ignored and never committed, or from environment variables in CI. If
 * neither is present the release build is left unsigned rather than silently
 * falling back to the debug key — a debug-signed artifact cannot be uploaded to
 * Play, and discovering that at upload time is worse than failing here.
 */
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def storeFilePath = hasKeystoreFile
    ? keystoreProperties['storeFile']
    : System.getenv('ANDROID_KEYSTORE_PATH')
def storePasswordValue = hasKeystoreFile
    ? keystoreProperties['storePassword']
    : System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = hasKeystoreFile
    ? keystoreProperties['keyAlias']
    : System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordValue = hasKeystoreFile
    ? keystoreProperties['keyPassword']
    : System.getenv('ANDROID_KEY_PASSWORD')
def canSignRelease = storeFilePath != null && file(storeFilePath).exists()

android {
    namespace = "org.shiftswitch.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "org.shiftswitch.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionJson.versionCode
        versionName versionJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Consumed by AndroidManifest.xml. The App Links host must match the
        // origin the app talks to and must serve /.well-known/assetlinks.json.
        manifestPlaceholders = [
            appScheme  : project.findProperty('appScheme') ?: 'shiftswitch',
            appLinkHost: project.findProperty('appLinkHost') ?: 'app.example.org'
        ]

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }

    // A release AAB that is not signed with a real upload key is a mistake, not
    // an artifact. Say so at configuration time, not at upload time.
    gradle.taskGraph.whenReady { graph ->
        def buildingRelease = graph.allTasks.any { task ->
            task.name.toLowerCase().contains('release') &&
                (task.name.startsWith('bundle') || task.name.startsWith('assemble'))
        }
        if (buildingRelease && !canSignRelease) {
            logger.warn(
                "\n[shiftswitch] WARNING: no release keystore configured.\n" +
                "  This build will be UNSIGNED and cannot be uploaded to Google Play.\n" +
                "  Set android/key.properties or the ANDROID_KEYSTORE_* environment\n" +
                "  variables. See docs/MOBILE_RELEASE.md.\n"
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
